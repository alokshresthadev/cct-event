<!doctype html><html><head><meta charset="utf-8"><title>Index of {{ path }}</title><style>body{font:15px monospace;background:#071314;color:#d8f0e9;padding:32px}a{color:#73e0bf}td{padding:7px 30px 7px 0}h1{font-size:20px;font-weight:400;border-bottom:1px solid #31514b;padding-bottom:14px}</style></head><body><h1>Index of {{ path }}</h1><table>{% if parent is not none %}<tr><td><a href="{{ url_for('files',subpath=parent) }}">../</a></td><td></td></tr>{% endif %}{% for entry in entries %}<tr><td><a href="{{ url_for('files',subpath=(path.replace('/files/','')+'/'+entry.name).strip('/')) }}">{{ entry.name }}</a></td><td>{{ entry.size }}</td></tr>{% endfor %}</table></body></html>
